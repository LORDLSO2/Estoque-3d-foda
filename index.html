<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Estoque 3D</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
}

#app {
    width: 100vw;
    height: 100vh;
    position: relative;
}

#viewer {
    width: 100%;
    height: 100%;
}

#topbar {

    position: absolute;

    top: 15px;
    left: 15px;
    right: 15px;

    z-index: 10;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 12px 15px;

    background: rgba(20,20,20,.92);

    border-radius: 12px;

    backdrop-filter: blur(10px);
}

#topbar h1 {

    margin: 0;

    font-size: 18px;

    margin-right: auto;
}

button {

    border: none;

    border-radius: 8px;

    padding: 10px 14px;

    cursor: pointer;

    background: #2563eb;

    color: white;

    font-weight: bold;
}

button:hover {

    background: #1d4ed8;
}

button.danger {

    background: #dc2626;
}

button.gray {

    background: #444;
}

#login {

    position: absolute;

    top: 80px;
    right: 15px;

    z-index: 20;

    width: 300px;

    padding: 20px;

    background: rgba(20,20,20,.96);

    border-radius: 12px;

    display: none;
}

#login input {

    width: 100%;

    padding: 10px;

    margin-bottom: 10px;

    border-radius: 7px;

    border: 1px solid #444;

    background: #222;

    color: white;
}

#panel {

    position: absolute;

    top: 80px;

    right: 15px;

    width: 330px;

    max-height: calc(100vh - 100px);

    overflow-y: auto;

    z-index: 15;

    background: rgba(20,20,20,.96);

    border-radius: 12px;

    padding: 18px;

    display: none;
}

#panel h2 {

    margin-top: 0;
}

#panel input,
#panel textarea {

    width: 100%;

    margin-bottom: 10px;

    padding: 10px;

    border-radius: 7px;

    border: 1px solid #444;

    background: #222;

    color: white;
}

#panel textarea {

    resize: vertical;

    min-height: 80px;
}

.marker {

    width: 22px;

    height: 22px;

    border-radius: 50%;

    background: #ef4444;

    border: 3px solid white;

    box-shadow: 0 0 15px rgba(239,68,68,.8);

    cursor: pointer;

    position: absolute;

    transform: translate(-50%, -50%);
}

.marker:hover {

    transform: translate(-50%, -50%) scale(1.25);
}

#status {

    position: absolute;

    bottom: 15px;

    left: 15px;

    z-index: 10;

    padding: 8px 12px;

    border-radius: 8px;

    background: rgba(0,0,0,.7);

    font-size: 13px;
}

#search {

    width: 220px;

    padding: 9px 12px;

    border-radius: 8px;

    border: 1px solid #444;

    background: #222;

    color: white;
}

#photoPreview {

    width: 100%;

    border-radius: 8px;

    margin-top: 5px;

    display: none;
}

.small {

    color: #aaa;

    font-size: 12px;

    margin-bottom: 10px;
}

</style>

</head>


<body>

<div id="app">

    <div id="viewer"></div>


    <div id="topbar">

        <h1>📦 Estoque 3D</h1>

        <input
            id="search"
            type="text"
            placeholder="🔎 Procurar caixa..."
        >

        <button id="newMarker">
            + Nova caixa
        </button>

        <button
            id="loginButton"
            class="gray"
        >
            🔐 Login
        </button>

        <button
            id="logoutButton"
            class="gray"
            style="display:none"
        >
            Sair
        </button>

    </div>


    <div id="login">

        <h2>Login</h2>

        <input
            id="email"
            type="email"
            placeholder="E-mail"
        >

        <input
            id="password"
            type="password"
            placeholder="Senha"
        >

        <button id="doLogin">
            Entrar
        </button>

        <p
            id="loginStatus"
            class="small"
        ></p>

    </div>


    <div id="panel">

        <h2>📦 Caixa</h2>

        <div class="small">
            Informações da caixa
        </div>


        <input
            id="markerName"
            placeholder="Nome / Produto"
        >

        <input
            id="markerSku"
            placeholder="SKU"
        >

        <input
            id="markerSize"
            placeholder="Tamanho"
        >

        <textarea
            id="markerDescription"
            placeholder="Descrição"
        ></textarea>


        <label>

            Foto da caixa:

            <input
                id="photo"
                type="file"
                accept="image/*"
            >

        </label>


        <img
            id="photoPreview"
        >


        <br><br>


        <button id="saveMarker">
            💾 Salvar
        </button>

        <button
            id="deleteMarker"
            class="danger"
        >
            🗑️ Excluir
        </button>

        <button
            id="closePanel"
            class="gray"
        >
            Fechar
        </button>

    </div>


    <div id="status">
        Carregando estoque...
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script type="importmap">

{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}

</script>


<script type="module">

import * as THREE
from "three";

import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";


// ======================================================
// SUPABASE
// ======================================================

// COLOQUE AQUI A URL DO SEU PROJETO
const SUPABASE_URL =
    "https://aoqrymkgxllxetpsbpij.supabase.co";

// COLOQUE AQUI A PUBLISHABLE KEY
const SUPABASE_KEY =
    "sb_publishable_HxiRQDQvkyT204_EQY8L8Q_cMBgPyEx";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ======================================================
// THREE.JS
// ======================================================

const viewer =
    document.getElementById("viewer");

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x202020);


const camera =
    new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        5000
    );

camera.position.set(
    20,
    20,
    20
);


const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    window.devicePixelRatio
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

viewer.appendChild(renderer.domElement);


// ======================================================
// CONTROLES
// ======================================================

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.target.set(
    0,
    0,
    0
);


// ======================================================
// LUZ
// ======================================================

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        2
    );

scene.add(ambient);


const directional =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

directional.position.set(
    20,
    40,
    20
);

scene.add(directional);


// ======================================================
// MODELO 3D
// ======================================================

const loader =
    new GLTFLoader();

let model = null;

loader.load(

    "estoque.glb",

    function(gltf) {

        model = gltf.scene;

        scene.add(model);

        // Centraliza o modelo automaticamente

        const box =
            new THREE.Box3()
            .setFromObject(model);

        const center =
            box.getCenter(
                new THREE.Vector3()
            );

        model.position.sub(center);


        const size =
            box.getSize(
                new THREE.Vector3()
            );

        const maxSize =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        camera.position.set(
            maxSize * 1.3,
            maxSize * 1.0,
            maxSize * 1.3
        );

        controls.target.set(
            0,
            0,
            0
        );

        controls.update();


        setStatus(
            "Modelo 3D carregado."
        );

    },

    undefined,

    function(error) {

        console.error(error);

        setStatus(
            "Erro ao carregar estoque.glb"
        );

    }

);


// ======================================================
// MARCADORES
// ======================================================

const markerContainer =
    document.createElement("div");

markerContainer.style.position =
    "absolute";

markerContainer.style.left = "0";

markerContainer.style.top = "0";

markerContainer.style.width = "100%";

markerContainer.style.height = "100%";

markerContainer.style.pointerEvents =
    "none";

viewer.appendChild(
    markerContainer
);


let markers = [];

let selectedMarker = null;


// ======================================================
// CARREGAR MARCADORES
// ======================================================

async function loadMarkers() {

    const {
        data,
        error
    } = await supabaseClient
        .from("markers")
        .select("*")
        .order("criado_em");


    if (error) {

        console.error(error);

        setStatus(
            "Erro ao carregar marcadores."
        );

        return;
    }


    markers = data || [];

    renderMarkers();

    setStatus(
        `${markers.length} caixas carregadas.`
    );
}


// ======================================================
// DESENHAR MARCADORES
// ======================================================

function renderMarkers() {

    markerContainer.innerHTML = "";


    for (const marker of markers) {

        const element =
            document.createElement("div");

        element.className =
            "marker";

        element.style.pointerEvents =
            "auto";


        element.title =
            marker.nome;


        element.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                selectMarker(marker);

            }
        );


        markerContainer.appendChild(
            element
        );


        marker.element =
            element;
    }
}


// ======================================================
// POSIÇÃO DOS MARCADORES NA TELA
// ======================================================

function updateMarkerPositions() {

    for (const marker of markers) {

        if (!marker.element)
            continue;


        const position =
            new THREE.Vector3(
                marker.pos_x,
                marker.pos_y,
                marker.pos_z
            );


        position.project(camera);


        const x =
            (position.x * .5 + .5)
            * window.innerWidth;


        const y =
            (-position.y * .5 + .5)
            * window.innerHeight;


        marker.element.style.left =
            `${x}px`;


        marker.element.style.top =
            `${y}px`;


        // Esconder se estiver atrás da câmera

        if (position.z > 1) {

            marker.element.style.display =
                "none";

        } else {

            marker.element.style.display =
                "block";

        }

    }
}


// ======================================================
// SELECIONAR MARCADOR
// ======================================================

function selectMarker(marker) {

    selectedMarker =
        marker;


    document.getElementById(
        "markerName"
    ).value =
        marker.nome || "";


    document.getElementById(
        "markerSku"
    ).value =
        marker.sku || "";


    document.getElementById(
        "markerSize"
    ).value =
        marker.tamanho || "";


    document.getElementById(
        "markerDescription"
    ).value =
        marker.descricao || "";


    const preview =
        document.getElementById(
            "photoPreview"
        );


    if (marker.foto_url) {

        preview.src =
            marker.foto_url;

        preview.style.display =
            "block";

    } else {

        preview.style.display =
            "none";

    }


    document.getElementById(
        "panel"
    ).style.display =
        "block";
}


// ======================================================
// NOVA CAIXA
// ======================================================

document.getElementById(
    "newMarker"
).addEventListener(
    "click",
    async function() {

        const {
            data: {
                user
            }
        } =
        await supabaseClient
        .auth
        .getUser();


        if (!user) {

            alert(
                "Você precisa fazer login para criar uma caixa."
            );

            return;
        }


        // cria no centro do estoque

        const {
            data,
            error
        } =
        await supabaseClient
        .from("markers")
        .insert({

            nome:
                "Nova caixa",

            pos_x: 0,

            pos_y: 1,

            pos_z: 0

        })
        .select()
        .single();


        if (error) {

            console.error(error);

            alert(
                "Erro ao criar marcador."
            );

            return;
        }


        markers.push(data);

        renderMarkers();

        selectMarker(data);

    }
);


// ======================================================
// SALVAR
// ======================================================

document.getElementById(
    "saveMarker"
).addEventListener(
    "click",
    async function() {

        if (!selectedMarker)
            return;


        const updates = {

            nome:
                document.getElementById(
                    "markerName"
                ).value,

            sku:
                document.getElementById(
                    "markerSku"
                ).value,

            tamanho:
                document.getElementById(
                    "markerSize"
                ).value,

            descricao:
                document.getElementById(
                    "markerDescription"
                ).value

        };


        // ==================================================
        // UPLOAD DA FOTO
        // ==================================================

        const file =
            document.getElementById(
                "photo"
            ).files[0];


        if (file) {

            const extension =
                file.name
                .split(".")
                .pop();


            const filename =
                `${selectedMarker.id}-${Date.now()}.${extension}`;


            const {
                error: uploadError
            } =
            await supabaseClient
            .storage
            .from("estoque-fotos")
            .upload(
                filename,
                file,
                {
                    contentType:
                        file.type
                }
            );


            if (uploadError) {

                console.error(
                    uploadError
                );

                alert(
                    "Erro ao enviar foto."
                );

                return;
            }


            const {
                data
            } =
            supabaseClient
            .storage
            .from("estoque-fotos")
            .getPublicUrl(
                filename
            );


            updates.foto_url =
                data.publicUrl;
        }


        // ==================================================
        // ATUALIZAR BANCO
        // ==================================================

        const {
            data,
            error
        } =
        await supabaseClient
        .from("markers")
        .update(updates)
        .eq(
            "id",
            selectedMarker.id
        )
        .select()
        .single();


        if (error) {

            console.error(error);

            alert(
                "Erro ao salvar."
            );

            return;
        }


        Object.assign(
            selectedMarker,
            data
        );


        renderMarkers();

        selectMarker(
            selectedMarker
        );


        setStatus(
            "Caixa salva!"
        );

    }
);


// ======================================================
// EXCLUIR
// ======================================================

document.getElementById(
    "deleteMarker"
).addEventListener(
    "click",
    async function() {

        if (!selectedMarker)
            return;


        if (!confirm(
            "Excluir esta caixa?"
        ))
            return;


        const {
            error
        } =
        await supabaseClient
        .from("markers")
        .delete()
        .eq(
            "id",
            selectedMarker.id
        );


        if (error) {

            console.error(error);

            alert(
                "Erro ao excluir."
            );

            return;
        }


        markers =
            markers.filter(
                m =>
                    m.id !==
                    selectedMarker.id
            );


        selectedMarker =
            null;


        renderMarkers();


        document.getElementById(
            "panel"
        ).style.display =
            "none";


        setStatus(
            "Caixa excluída."
        );

    }
);


// ======================================================
// FECHAR PAINEL
// ======================================================

document.getElementById(
    "closePanel"
).addEventListener(
    "click",
    function() {

        document.getElementById(
            "panel"
        ).style.display =
            "none";

        selectedMarker =
            null;

    }
);


// ======================================================
// LOGIN
// ======================================================

document.getElementById(
    "loginButton"
).addEventListener(
    "click",
    function() {

        document.getElementById(
            "login"
        ).style.display =
            "block";

    }
);


document.getElementById(
    "doLogin"
).addEventListener(
    "click",
    async function() {

        const email =
            document.getElementById(
                "email"
            ).value;

        const password =
            document.getElementById(
                "password"
            ).value;


        const {
            error
        } =
        await supabaseClient
        .auth
        .signInWithPassword({
            email,
            password
        });


        if (error) {

            document.getElementById(
                "loginStatus"
            ).textContent =
                error.message;

            return;
        }


        document.getElementById(
            "login"
        ).style.display =
            "none";


        updateAuthUI();

    }
);


// ======================================================
// LOGOUT
// ======================================================

document.getElementById(
    "logoutButton"
).addEventListener(
    "click",
    async function() {

        await supabaseClient
            .auth
            .signOut();

        updateAuthUI();

    }
);


// ======================================================
// AUTH UI
// ======================================================

async function updateAuthUI() {

    const {
        data: {
            user
        }
    } =
    await supabaseClient
        .auth
        .getUser();


    document.getElementById(
        "loginButton"
    ).style.display =
        user
            ? "none"
            : "block";


    document.getElementById(
        "logoutButton"
    ).style.display =
        user
            ? "block"
            : "none";


    document.getElementById(
        "newMarker"
    ).style.display =
        user
            ? "block"
            : "none";

}


supabaseClient
    .auth
    .onAuthStateChange(
        function() {

            updateAuthUI();

        }
    );


// ======================================================
// REALTIME
// ======================================================

supabaseClient
.channel("estoque-realtime")

.on(
    "postgres_changes",
    {
        event: "*",
        schema: "public",
        table: "markers"
    },
    function(payload) {

        console.log(
            "Alteração:",
            payload
        );


        loadMarkers();

    }
)

.subscribe();


// ======================================================
// BUSCA
// ======================================================

document.getElementById(
    "search"
).addEventListener(
    "input",
    function() {

        const search =
            this.value
            .toLowerCase()
            .trim();


        for (const marker of markers) {

            const text =
                `${marker.nome}
                ${marker.sku}
                ${marker.tamanho}
                ${marker.descricao}`
                .toLowerCase();


            if (
                !search ||
                text.includes(search)
            ) {

                marker.element.style.display =
                    "block";

            } else {

                marker.element.style.display =
                    "none";

            }

        }

    }
);


// ======================================================
// STATUS
// ======================================================

function setStatus(text) {

    document.getElementById(
        "status"
    ).textContent =
        text;

}


// ======================================================
// ANIMAÇÃO
// ======================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    controls.update();

    updateMarkerPositions();


    renderer.render(
        scene,
        camera
    );

}

animate();


// ======================================================
// RESPONSIVO
// ======================================================

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// ======================================================
// INICIALIZAÇÃO
// ======================================================

loadMarkers();

updateAuthUI();

</script>

</body>

</html>
