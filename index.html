<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estoque 3D</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #eeeeee;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    h1 {
      position: absolute;
      z-index: 10;
      left: 20px;
      top: 10px;
      margin: 0;
      color: #222;
      font-size: 24px;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #eeeeee;
    }

    .hotspot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid white;
      background: #007bff;
      box-shadow: 0 2px 8px #00000066;
      cursor: pointer;
    }

    .info {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      background: white;
      padding: 18px 25px;
      border-radius: 12px;
      box-shadow: 0 5px 25px #00000033;
      display: none;
      z-index: 20;
      min-width: 250px;
      text-align: center;
    }

    .info h2 {
      margin-top: 0;
    }

    .fechar {
      background: #222;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>📦 Estoque 3D</h1>

  <model-viewer
    src="Sem%20t%C3%ADtulo.glb"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1"
    exposure="1">

    <!-- PONTO INTERATIVO DE TESTE -->
    <button
      class="hotspot"
      slot="hotspot-1"
      data-position="0m 1m 0m"
      data-normal="0m 0m 1m"
      onclick="mostrarInfo()">
    </button>

  </model-viewer>

  <div class="info" id="info">
    <h2>🟦 Produto de teste</h2>

    <p><strong>Produto:</strong> Camiseta Asics</p>
    <p><strong>Código:</strong> AS-001</p>
    <p><strong>Tamanho:</strong> M</p>
    <p><strong>Quantidade:</strong> 15</p>
    <p><strong>Local:</strong> Prateleira 01</p>

    <button class="fechar" onclick="fecharInfo()">
      Fechar
    </button>
  </div>

  <script>
    function mostrarInfo() {
      document.getElementById("info").style.display = "block";
    }

    function fecharInfo() {
      document.getElementById("info").style.display = "none";
    }
  </script>

</body>
</html>
