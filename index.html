<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estoque 3D</title>

    <!-- Biblioteca para visualizar modelos 3D -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        header {
            height: 70px;
            background: #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-bottom: 1px solid #374151;
        }

        header h1 {
            font-size: 22px;
        }

        header span {
            color: #9ca3af;
            font-size: 14px;
        }

        /* =========================
           ÁREA PRINCIPAL
        ========================= */

        .container {
            display: grid;
            grid-template-columns: 1fr 350px;
            height: calc(100vh - 70px);
        }

        /* =========================
           MODELO 3D
        ========================= */

        .viewer-container {
            position: relative;
            background: #0b1120;
            min-height: 500px;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: #0b1120;
            --poster-color: #0b1120;
        }

        /* Mensagem em cima do modelo */

        .instructions {
            position: absolute;
            left: 20px;
            bottom: 20px;

            background: rgba(0, 0, 0, 0.65);
            padding: 12px 16px;
            border-radius: 10px;

            color: #d1d5db;
            font-size: 13px;

            backdrop-filter: blur(5px);
        }

        /* =========================
           PAINEL LATERAL
        ========================= */

        .sidebar {
            background: #1f2937;
            border-left: 1px solid #374151;

            padding: 20px;

            overflow-y: auto;
        }

        .sidebar h2 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 20px;
        }

        /* =========================
           PRODUTO SELECIONADO
        ========================= */

        .info-box {
            background: #111827;
            border: 1px solid #374151;
            border-radius: 12px;

            padding: 18px;
            margin-bottom: 20px;
        }

        .info-box h3 {
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;

            padding: 9px 0;

            border-bottom: 1px solid #374151;

            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #9ca3af;
        }

        .stock {
            font-weight: bold;
            color: #22c55e;
        }

        /* =========================
           BOTÕES
        ========================= */

        .locations-title {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .location-button {
            width: 100%;

            border: 1px solid #374151;
            background: #111827;
            color: white;

            padding: 13px;

            margin-bottom: 8px;

            border-radius: 9px;

            cursor: pointer;

            text-align: left;

            transition: 0.2s;
        }

        .location-button:hover {
            background: #374151;
            transform: translateX(3px);
        }

        .location-button.active {
            background: #2563eb;
            border-color: #3b82f6;
        }

        .location-name {
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        .location-product {
            color: #9ca3af;
            font-size: 12px;
        }

        .location-button.active .location-product {
            color: #dbeafe;
        }

        /* =========================
           BOTÃO TELA CHEIA
        ========================= */

        .fullscreen-button {
            position: absolute;

            top: 20px;
            right: 20px;

            background: rgba(0, 0, 0, 0.65);

            color: white;

            border: 1px solid #4b5563;

            border-radius: 8px;

            padding: 10px 14px;

            cursor: pointer;

            z-index: 10;
        }

        .fullscreen-button:hover {
            background: #374151;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            header {
                height: 60px;
                padding: 0 15px;
            }

            header h1 {
                font-size: 18px;
            }

            header span {
                display: none;
            }

            .container {
                display: block;
                height: auto;
            }

            .viewer-container {
                height: 60vh;
                min-height: 400px;
            }

            .sidebar {
                border-left: none;
                border-top: 1px solid #374151;
            }

            .instructions {
                bottom: 10px;
                left: 10px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         CABEÇALHO
    ========================= -->

    <header>

        <h1>📦 Estoque 3D</h1>

        <span>
            Visualização interativa do estoque
        </span>

    </header>


    <!-- =========================
         CONTEÚDO
    ========================= -->

    <div class="container">


        <!-- =========================
             MODELO 3D
        ========================= -->

        <div class="viewer-container">

            <button
                class="fullscreen-button"
                onclick="fullscreenViewer()">
                ⛶ Tela cheia
            </button>


            <!--
                SEU MODELO 3D

                O nome do arquivo precisa ser exatamente:
                Sem título.glb
            -->

            <model-viewer
                id="modelo3d"

                src="Sem%20t%C3%ADtulo.glb"

                camera-controls

                touch-action="pan-y"

                auto-rotate

                shadow-intensity="1"

                exposure="1"

                environment-image="neutral"

                camera-orbit="0deg 75deg 4m"

                field-of-view="35deg"

                loading="eager"

                alt="Modelo 3D do estoque">

            </model-viewer>


            <div class="instructions">

                🖱️ Arraste para girar ·
                🔍 Scroll para zoom ·
                📱 Arraste com o dedo no celular

            </div>

        </div>


        <!-- =========================
             PAINEL
        ========================= -->

        <aside class="sidebar">

            <h2>📋 Informações</h2>

            <p class="subtitle">
                Selecione uma localização para visualizar os dados.
            </p>


            <!-- PRODUTO SELECIONADO -->

            <div class="info-box">

                <h3 id="produtoNome">
                    Selecione um local
                </h3>


                <div class="info-row">

                    <span class="info-label">
                        Localização
                    </span>

                    <span id="produtoLocal">
                        —
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Quantidade
                    </span>

                    <span
                        id="produtoQuantidade"
                        class="stock">
                        —
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Código
                    </span>

                    <span id="produtoCodigo">
                        —
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Status
                    </span>

                    <span id="produtoStatus">
                        —
                    </span>

                </div>

            </div>


            <!-- LOCALIZAÇÕES -->

            <h3 class="locations-title">
                📍 Localizações
            </h3>


            <div id="locations">

                <!--
                    Os botões serão criados
                    automaticamente pelo JavaScript.
                -->

            </div>

        </aside>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /*
        ============================================================
        DADOS DO ESTOQUE

        É AQUI que você vai colocar seus produtos.

        Pode adicionar quantos quiser.
        ============================================================
        */

        const estoque = [

            {
                local: "A-01",
                produto: "Produto exemplo 1",
                quantidade: 25,
                codigo: "PROD-001",
                status: "Disponível"
            },

            {
                local: "A-02",
                produto: "Produto exemplo 2",
                quantidade: 12,
                codigo: "PROD-002",
                status: "Disponível"
            },

            {
                local: "A-03",
                produto: "Produto exemplo 3",
                quantidade: 4,
                codigo: "PROD-003",
                status: "Baixo estoque"
            },

            {
                local: "B-01",
                produto: "Produto exemplo 4",
                quantidade: 0,
                codigo: "PROD-004",
                status: "Sem estoque"
            },

            {
                local: "B-02",
                produto: "Produto exemplo 5",
                quantidade: 38,
                codigo: "PROD-005",
                status: "Disponível"
            },

            {
                local: "B-03",
                produto: "Produto exemplo 6",
                quantidade: 17,
                codigo: "PROD-006",
                status: "Disponível"
            }

        ];


        /*
        ============================================================
        CRIAR OS BOTÕES
        ============================================================
        */

        const locationsContainer =
            document.getElementById("locations");


        estoque.forEach((item, index) => {

            const button =
                document.createElement("button");


            button.className =
                "location-button";


            button.innerHTML = `

                <span class="location-name">
                    📍 ${item.local}
                </span>

                <span class="location-product">
                    ${item.produto}
                </span>

            `;


            button.onclick = function () {

                selecionarProduto(index);

            };


            locationsContainer.appendChild(button);

        });


        /*
        ============================================================
        SELECIONAR PRODUTO
        ============================================================
        */

        function selecionarProduto(index) {

            const item = estoque[index];


            /*
            Atualiza informações
            */

            document.getElementById("produtoNome")
                .textContent = item.produto;


            document.getElementById("produtoLocal")
                .textContent = item.local;


            document.getElementById("produtoQuantidade")
                .textContent = item.quantidade;


            document.getElementById("produtoCodigo")
                .textContent = item.codigo;


            document.getElementById("produtoStatus")
                .textContent = item.status;


            /*
            Remove seleção anterior
            */

            const buttons =
                document.querySelectorAll(".location-button");


            buttons.forEach(button => {

                button.classList.remove("active");

            });


            /*
            Seleciona o botão atual
            */

            buttons[index].classList.add("active");


            /*
            Muda a cor da quantidade
            */

            const quantidade =
                document.getElementById("produtoQuantidade");


            if (item.quantidade === 0) {

                quantidade.style.color = "#ef4444";

            }

            else if (item.quantidade <= 5) {

                quantidade.style.color = "#f59e0b";

            }

            else {

                quantidade.style.color = "#22c55e";

            }

        }


        /*
        ============================================================
        TELA CHEIA
        ============================================================
        */

        function fullscreenViewer() {

            const viewer =
                document.getElementById("modelo3d");


            if (viewer.requestFullscreen) {

                viewer.requestFullscreen();

            }

            else if (viewer.webkitRequestFullscreen) {

                viewer.webkitRequestFullscreen();

            }

        }


        /*
        ============================================================
        QUANDO O MODELO TERMINAR DE CARREGAR
        ============================================================
        */

        const viewer =
            document.getElementById("modelo3d");


        viewer.addEventListener("load", () => {

            console.log("Modelo 3D carregado com sucesso!");

        });


        /*
        ============================================================
        ERRO AO CARREGAR O MODELO
        ============================================================
        */

        viewer.addEventListener("error", (error) => {

            console.error(
                "Erro ao carregar o modelo 3D:",
                error
            );

        });

    </script>

</body>
</html>
